<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b45309">
<meta name="description" content="Grave uma ideia ou problema por voz, revise a transcrição e envie por email antes de esquecer.">
<title>Gravador de Ideias</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ideias">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.4M12 18.6V21M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M3 12h2.4M18.6 12H21M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h9.5a3.5 3.5 0 0 0 .6-6.95 5.5 5.5 0 0 0-10.6-2A4 4 0 0 0 7 18z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7-7-1z"/></symbol>
  <symbol id="i-broom" viewBox="0 0 24 24"><path d="M14 4l6 6-7 7-6-6z"/><path d="M9 15l-6 6M5 17l2 2M4 20l2 2"/></symbol>
</svg>

<header class="topbar">
  <h1 class="topbar-title">Gravador de Ideias</h1>
  <button type="button" class="icon-btn" id="btn-settings" aria-label="Configurações">
    <svg class="icon"><use href="#i-gear"></use></svg>
  </button>
</header>

<main id="app">
  <section class="card recorder">
    <button type="button" class="mic-btn" id="btn-mic" aria-label="Gravar ideia">
      <svg class="icon icon--mic"><use href="#i-mic"></use></svg>
    </button>
    <p class="mic-status" id="mic-status">Toque no microfone e descreva a ideia ou o problema.</p>

    <textarea id="transcript" rows="4"
      placeholder="O texto aparece aqui enquanto você fala — pode editar antes de enviar."></textarea>

    <div class="recorder-actions">
      <button type="button" class="btn" id="btn-limpar">
        <svg class="icon"><use href="#i-x"></use></svg> Limpar
      </button>
      <button type="button" class="btn btn--solid btn--grow" id="btn-enviar">
        <svg class="icon"><use href="#i-send"></use></svg> Enviar por email
      </button>
    </div>
    <p class="hint" id="envio-hint"></p>
  </section>

  <section class="historico-secao">
    <h2 class="secao-titulo">Histórico</h2>
    <div id="lista-historico"></div>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
